name: Weekly COBOL Hatena Post

on:
  schedule:
    - cron: "0 1 * * 6" # Saturday 10:00 JST (GitHub Actions uses UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobol-hatena-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and publish weekly article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HATENA_USER_ID: ${{ secrets.HATENA_USER_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_COBOL_BLOG_ID: ${{ secrets.HATENA_COBOL_BLOG_ID }}
        run: python scripts/publish_cobol_hatena.py
